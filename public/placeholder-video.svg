<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Video placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0F2A4D"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no inset frame) -->
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="rgba(255,255,255,0.06)"/>
  <rect y="424" width="600" height="10" fill="url(#acc)" opacity="0.95"/>

  <!-- play button -->
  <g filter="url(#soft)" transform="translate(300 210)">
    <circle r="72" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)"/>
    <circle r="60" fill="rgba(255,255,255,0.12)"/>
    <path d="M-12 -22 L 32 0 L -12 22 Z" fill="#E6EEF8"/>
  </g>

  <!-- caption -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" text-anchor="middle">
    <text x="300" y="330" font-size="22" font-weight="900" fill="#E6EEF8" letter-spacing="0.6">VIDEO</text>
    <text x="300" y="360" font-size="13" font-weight="650" fill="rgba(230,238,248,0.78)">Thumbnail will appear after render</text>
  </g>
</svg>

