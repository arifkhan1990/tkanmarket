<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TkanMarket OpenGraph placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0F2A4D"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <rect x="70" y="70" width="1060" height="490" rx="48" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="110" y="110" width="980" height="410" rx="40" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
  </g>

  <rect x="110" y="410" width="980" height="10" rx="5" fill="url(#acc)" opacity="0.9"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#E6EEF8">
    <text x="110" y="255" font-size="72" font-weight="800" letter-spacing="-1">TkanMarket</text>
    <text x="110" y="315" font-size="28" font-weight="600" fill="rgba(230,238,248,0.85)">
      B2B fabric sourcing for Russia &amp; CIS
    </text>
    <text x="110" y="365" font-size="20" font-weight="600" fill="rgba(230,238,248,0.70)">
      Catalog " Suppliers " Samples " Wholesale inquiries
    </text>
  </g>

  <g transform="translate(860,160)">
    <path d="M10 120 C 70 20, 210 20, 270 120 C 210 220, 70 220, 10 120 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
    <path d="M40 120 C 85 55, 195 55, 240 120 C 195 185, 85 185, 40 120 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <path d="M70 120 C 105 90, 175 90, 210 120 C 175 150, 105 150, 70 120 Z" fill="url(#acc)" opacity="0.35"/>
  </g>
</svg>

