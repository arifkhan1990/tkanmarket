<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Fabric image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#e0e9ff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#1a40c2"/>
    </linearGradient>
    <pattern id="weave" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 8h32M0 24h32" stroke="#1a40c2" stroke-width="1" fill="none" opacity="0.10"/>
      <path d="M8 0v32M24 0v32" stroke="#1a40c2" stroke-width="1" fill="none" opacity="0.10"/>
      <path d="M0 0l32 32M32 0L0 32" stroke="#1a40c2" stroke-width="0.6" fill="none" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#weave)"/>

  <!-- Logo tile (T mark) -->
  <g transform="translate(228 196)">
    <rect width="144" height="144" rx="32" fill="url(#brand)"/>
    <rect x="0.5" y="0.5" width="143" height="143" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <text x="72" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="86" font-weight="900" fill="#ffffff">T</text>
  </g>

  <!-- Caption -->
  <g transform="translate(300 396)">
    <text text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.8" fill="#1a40c2">TKANMARKET</text>
    <text y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#444654">Fabric image coming soon</text>
  </g>
</svg>
