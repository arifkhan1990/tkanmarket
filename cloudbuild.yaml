# ============================================================================
# TkanMarket — Cloud Build pipeline (auto-deploy to Cloud Run).
#
# How it becomes "automatic":
#   1. GCP Console -> Cloud Build -> Triggers -> Connect repository
#   2. Point it at this GitHub repo, branch: ^main$
#   3. It fires on every push to main and runs the steps below.
#
# One image is built and deployed to TWO Cloud Run services:
#   - tkanmarket-web      `node server.js`
#   - tkanmarket-worker   `node dist-workers/src/workers/index.js`
#
# Secret Manager names referenced below must exist (see README.md "One-time GCP
# setup"). Secrets are read at runtime by Cloud Run; they never touch git.
# ============================================================================

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  # ---- Artifact Registry ----
  _REGION: us-central1
  _REPO: tkanmarket
  _IMAGE: ${_REGION}-docker.pkg.dev/tkanmarket/${_REPO}/tkanmarket

  # ---- Cloud Run services ----
  _WEB_SERVICE: tkanmarket-web
  _WORKER_SERVICE: tkanmarket-worker
  _SERVICE_ACCOUNT: ""          # empty -> default compute service account
  # Direct VPC egress (no Serverless VPC connector needed) so Cloud Run can
  # reach Memorystore Redis on its private IP. Subnet must be >= /26.
  _NETWORK: default
  _SUBNET: default
  _VPC_EGRESS: private-ranges-only
  _CLOUD_SQL_INSTANCE: tkanmarket:us-central1:tkanmarket
  _WEB_CPU: "2"
  _WEB_MEMORY: 2Gi
  _WEB_MIN: "1"
  _WORKER_CPU: "2"
  _WORKER_MEMORY: 4Gi
  _WORKER_MIN: "1"
  _WORKER_CONCURRENCY: "1"

  # ---- Build-time (public) env vars inlined by Next.js ----
  _NEXT_PUBLIC_SITE_URL: https://tkanmarket.xyz
  _NEXT_PUBLIC_DOCS_URL: ""
  _NEXT_PUBLIC_INSTAGRAM_URL: ""
  _NEXT_PUBLIC_TIKTOK_URL: ""
  _NEXT_PUBLIC_PINTEREST_URL: ""
  _NEXT_PUBLIC_TELEGRAM_URL: ""
  _NEXT_PUBLIC_WHATSAPP_URL: ""

steps:
  # 1. Build
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_IMAGE:${SHORT_SHA}
      - -t
      - $_IMAGE:latest
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=$_NEXT_PUBLIC_SITE_URL
      - --build-arg
      - NEXT_PUBLIC_DOCS_URL=$_NEXT_PUBLIC_DOCS_URL
      - --build-arg
      - NEXT_PUBLIC_INSTAGRAM_URL=$_NEXT_PUBLIC_INSTAGRAM_URL
      - --build-arg
      - NEXT_PUBLIC_TIKTOK_URL=$_NEXT_PUBLIC_TIKTOK_URL
      - --build-arg
      - NEXT_PUBLIC_PINTEREST_URL=$_NEXT_PUBLIC_PINTEREST_URL
      - --build-arg
      - NEXT_PUBLIC_TELEGRAM_URL=$_NEXT_PUBLIC_TELEGRAM_URL
      - --build-arg
      - NEXT_PUBLIC_WHATSAPP_URL=$_NEXT_PUBLIC_WHATSAPP_URL
      - .

  # 2. Push
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE:${SHORT_SHA}

  # 3. Deploy web service (Next.js standalone server)
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SA=()
        [ -n "$_SERVICE_ACCOUNT" ] && SA=(--service-account="$_SERVICE_ACCOUNT")
        CSQL=()
        [ -n "$_CLOUD_SQL_INSTANCE" ] && CSQL=(--add-cloudsql-instances="$_CLOUD_SQL_INSTANCE")
        gcloud run deploy "$_WEB_SERVICE" \
          --image="$_IMAGE:${SHORT_SHA}" \
          --region="$_REGION" \
          --platform=managed \
          --allow-unauthenticated \
          --network="$_NETWORK" \
          --subnet="$_SUBNET" \
          --vpc-egress="$_VPC_EGRESS" \
          --cpu="$_WEB_CPU" \
          --memory="$_WEB_MEMORY" \
          --min-instances="$_WEB_MIN" \
          "${SA[@]}" "${CSQL[@]}" \
          --command=node \
           --args=server.js \
           --set-secrets="DATABASE_URL=database_url:latest,REDIS_URL=redis_url:latest,GOOGLE_API_KEY=google_api_key:latest,NEXTAUTH_SECRET=nextauth_secret:latest,SOCIAL_TOKEN_ENCRYPTION_KEY=social_token_encryption_key:latest,CLOUDFLARE_R2_ACCOUNT_ID=cloudflare_r2_account_id:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=cloudflare_r2_access_key_id:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=cloudflare_r2_secret_access_key:latest,CLOUDFLARE_R2_BUCKET=cloudflare_r2_bucket:latest,CLOUDFLARE_R2_PUBLIC_BASE_URL=cloudflare_r2_public_base_url:latest,ADMIN_EMAIL=admin_email:latest,ADMIN_PASSWORD=admin_password:latest,FACEBOOK_CLIENT_ID=facebook_client_id:latest,FACEBOOK_CLIENT_SECRET=facebook_client_secret:latest,FACEBOOK_WEBHOOK_VERIFY_TOKEN=facebook_webhook_verify_token:latest,INSTAGRAM_CLIENT_ID=instagram_client_id:latest,INSTAGRAM_CLIENT_SECRET=instagram_client_secret:latest,INSTAGRAM_WEBHOOK_VERIFY_TOKEN=instagram_webhook_verify_token:latest,CRAWLER_PROXY_URL=crawler_proxy_url:latest,CRAWLER_PROXY_HOSTPORT=crawler_proxy_hostport:latest,CRAWLER_SITE_COOKIES=crawler_site_cookies:latest,CRAWLER_CNY_TO_USD_RATE=crawler_cny_to_usd_rate:latest,CRAWLER_REQUEST_DELAY_MIN=crawler_request_delay_min:latest,CRAWLER_REQUEST_DELAY_MAX=crawler_request_delay_max:latest,CRAWLER_MAX_PAGES_PER_KEYWORD=crawler_max_pages_per_keyword:latest,CRAWLER_MAX_CONCURRENT_PAGES=crawler_max_concurrent_pages:latest,CRAWLER_DEDUPE_TTL_SECONDS=crawler_dedupe_ttl_seconds:latest,CRAWLER_PAGE_TIMEOUT=crawler_page_timeout:latest,CRAWLER_WORKER_JOB_TIMEOUT_MS=crawler_worker_job_timeout_ms:latest,CRAWLER_HARD_TIMEOUT_MS=crawler_hard_timeout_ms:latest" \
           --set-env-vars="NEXTAUTH_URL=${_NEXT_PUBLIC_SITE_URL},AUTH_TRUST_HOST=true,LOG_LEVEL=info,FACEBOOK_REDIRECT_URI=https://tkanmarket.xyz/api/v1/admin/social/integrations/facebook/callback"
        gcloud run services update-traffic "$_WEB_SERVICE" \
          --region="$_REGION" --to-latest

  # 4. Deploy worker service (BullMQ workers, long-running)
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SA=()
        [ -n "$_SERVICE_ACCOUNT" ] && SA=(--service-account="$_SERVICE_ACCOUNT")
        CSQL=()
        [ -n "$_CLOUD_SQL_INSTANCE" ] && CSQL=(--add-cloudsql-instances="$_CLOUD_SQL_INSTANCE")
        gcloud run deploy "$_WORKER_SERVICE" \
          --image="$_IMAGE:${SHORT_SHA}" \
          --region="$_REGION" \
          --platform=managed \
          --no-allow-unauthenticated \
          --network="$_NETWORK" \
          --subnet="$_SUBNET" \
          --vpc-egress="$_VPC_EGRESS" \
          --cpu="$_WORKER_CPU" \
          --memory="$_WORKER_MEMORY" \
          --min-instances="$_WORKER_MIN" \
          --max-instances="$_WORKER_MIN" \
          --concurrency="$_WORKER_CONCURRENCY" \
          --timeout=3600 \
          "${SA[@]}" "${CSQL[@]}" \
          --command=node \
          --args=dist-workers/src/workers/index.js \
          --set-secrets="DATABASE_URL=database_url:latest,REDIS_URL=redis_url:latest,GOOGLE_API_KEY=google_api_key:latest,NEXTAUTH_SECRET=nextauth_secret:latest,SOCIAL_TOKEN_ENCRYPTION_KEY=social_token_encryption_key:latest,CLOUDFLARE_R2_ACCOUNT_ID=cloudflare_r2_account_id:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=cloudflare_r2_access_key_id:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=cloudflare_r2_secret_access_key:latest,CLOUDFLARE_R2_BUCKET=cloudflare_r2_bucket:latest,CLOUDFLARE_R2_PUBLIC_BASE_URL=cloudflare_r2_public_base_url:latest,ADMIN_EMAIL=admin_email:latest,ADMIN_PASSWORD=admin_password:latest,FACEBOOK_CLIENT_ID=facebook_client_id:latest,FACEBOOK_CLIENT_SECRET=facebook_client_secret:latest,FACEBOOK_WEBHOOK_VERIFY_TOKEN=facebook_webhook_verify_token:latest,INSTAGRAM_CLIENT_ID=instagram_client_id:latest,INSTAGRAM_CLIENT_SECRET=instagram_client_secret:latest,INSTAGRAM_WEBHOOK_VERIFY_TOKEN=instagram_webhook_verify_token:latest,CRAWLER_PROXY_URL=crawler_proxy_url:latest,CRAWLER_PROXY_HOSTPORT=crawler_proxy_hostport:latest,CRAWLER_SITE_COOKIES=crawler_site_cookies:latest,CRAWLER_CNY_TO_USD_RATE=crawler_cny_to_usd_rate:latest,CRAWLER_REQUEST_DELAY_MIN=crawler_request_delay_min:latest,CRAWLER_REQUEST_DELAY_MAX=crawler_request_delay_max:latest,CRAWLER_MAX_PAGES_PER_KEYWORD=crawler_max_pages_per_keyword:latest,CRAWLER_MAX_CONCURRENT_PAGES=crawler_max_concurrent_pages:latest,CRAWLER_DEDUPE_TTL_SECONDS=crawler_dedupe_ttl_seconds:latest,CRAWLER_PAGE_TIMEOUT=crawler_page_timeout:latest,CRAWLER_WORKER_JOB_TIMEOUT_MS=crawler_worker_job_timeout_ms:latest,CRAWLER_HARD_TIMEOUT_MS=crawler_hard_timeout_ms:latest" \
          --set-env-vars="NEXTAUTH_URL=${_NEXT_PUBLIC_SITE_URL},AUTH_TRUST_HOST=true,LOG_LEVEL=info"

images:
  - $_IMAGE:${SHORT_SHA}
  - $_IMAGE:latest